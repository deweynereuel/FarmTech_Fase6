  <text x="316" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#496574">Wi-Fi</text>
  <text x="1280" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#496574">pressionar S</text>
  <text x="70" y="492" font-family="Arial, sans-serif" font-size="14" fill="#496574">Figura autoral: o Iriun transporta o vídeo via Wi-Fi e expõe a câmera do iPhone como dispositivo virtual no Windows.</text>
