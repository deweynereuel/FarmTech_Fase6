<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Ir Além com iPhone, Iriun e webcam virtual</title>
  <desc id="desc">Fluxo do iPhone por Wi-Fi ao Iriun no Windows, OpenCV, YOLOv5 customizado, tela e evidências.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5fbf8"/><stop offset="1" stop-color="#eaf1ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#456477"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1400" height="530" fill="url(#bg)"/>
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#123247">Ir Além — Detecção em tempo real com iPhone + Iriun</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="18" fill="#496574">Wi-Fi para webcam virtual no Windows • modelo YOLOv5 customizado para chair e bottle</text>
