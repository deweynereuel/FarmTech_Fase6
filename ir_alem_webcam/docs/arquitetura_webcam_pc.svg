    <text x="175" y="443" text-anchor="middle" font-size="15" fill="#496574">captura e envio Wi-Fi</text>
    <rect x="360" y="194" width="210" height="190" rx="20" fill="#ffffff" stroke="#5e9bb0" stroke-width="2"/>
