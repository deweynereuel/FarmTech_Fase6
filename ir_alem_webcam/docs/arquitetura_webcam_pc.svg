    <text x="465" y="443" text-anchor="middle" font-size="15" fill="#496574">Iriun + OpenCV no Windows</text>
    <rect x="650" y="194" width="210" height="190" rx="20" fill="#ffffff" stroke="#5e9bb0" stroke-width="2"/>
    <path d="M700 312 l25-70 25 35 25-60 35 95z" fill="none" stroke="#e1772a" stroke-width="8"/>
    <text x="755" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#c55a13">YOLOv5</text>
    <text x="755" y="416" text-anchor="middle" font-size="20" font-weight="700" fill="#123247">3. best.pt customizado</text>
    <text x="755" y="443" text-anchor="middle" font-size="15" fill="#496574">classe, caixa e confiança</text>
    <rect x="940" y="194" width="210" height="190" rx="20" fill="#ffffff" stroke="#5e9bb0" stroke-width="2"/>
    <rect x="979" y="223" width="132" height="90" rx="6" fill="#223848"/><rect x="992" y="236" width="106" height="64" fill="#e5f0e8"/>
    <rect x="1010" y="253" width="45" height="30" fill="none" stroke="#f28728" stroke-width="3"/><text x="1013" y="250" font-size="11" fill="#e1772a">bottle 0.92</text>
    <text x="1045" y="416" text-anchor="middle" font-size="20" font-weight="700" fill="#123247">4. Monitor ao vivo</text>
    <text x="1045" y="443" text-anchor="middle" font-size="15" fill="#496574">caixas, confiança e FPS</text>
    <rect x="1210" y="194" width="135" height="190" rx="20" fill="#ffffff" stroke="#5e9bb0" stroke-width="2"/>
